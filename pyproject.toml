[project]
name = "sqlitewatch"
version = "0.2.1"
description = "Runtime profiler for SQLite applications on Linux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "frida==17.16.1",
]

[project.scripts]
sqlitewatch = "sqlitewatch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlitewatch"]
force-include = { "src/sqlitewatch/agent/sqlitewatch_agent.js" = "sqlitewatch/agent/sqlitewatch_agent.js", "src/sqlitewatch/agent/launcher_bootstrap.js" = "sqlitewatch/agent/launcher_bootstrap.js" }

[tool.pytest.ini_options]
markers = [
    "integration: requires native build tools and a working Frida installation",
]
testpaths = ["tests"]
addopts = "-ra"
